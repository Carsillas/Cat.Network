name: Build And Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - rewrite

env:
  DOTNET_TEST_SDK_VERSION: '8.0.x'
  CONFIGURATION: Release

jobs:
  verify:
    name: Build And Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Compiler SDK And .NET 8 Test Runtime
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: ${{ env.DOTNET_TEST_SDK_VERSION }}

      - name: Show Selected SDK And Installed Runtimes
        run: dotnet --info

      - name: Restore
        run: dotnet restore Cat.Network.sln

      - name: Build
        run: dotnet build Cat.Network.sln --configuration ${{ env.CONFIGURATION }} --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test Cat.Network.sln --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal

      - name: Pack
        run: dotnet pack Cat.Network/Cat.Network.csproj --configuration ${{ env.CONFIGURATION }} --no-build --output artifacts -p:ContinuousIntegrationBuild=true

      - name: Test Package Consumer
        shell: pwsh
        run: ./smoke/PackageConsumer/verify.ps1 -Configuration ${{ env.CONFIGURATION }}

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg

  publish:
    name: Publish NuGet Package
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Compiler SDK And .NET 8 Test Runtime
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: ${{ env.DOTNET_TEST_SDK_VERSION }}

      - name: Show Selected SDK And Installed Runtimes
        run: dotnet --info

      - name: Extract Version
        id: version
        shell: bash
        run: |
          RAW_TAG="${GITHUB_REF##refs/tags/}"
          VERSION="${RAW_TAG#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Cat.Network.sln

      - name: Build
        run: dotnet build Cat.Network.sln --configuration ${{ env.CONFIGURATION }} --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test Cat.Network.sln --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal

      - name: Pack
        run: dotnet pack Cat.Network/Cat.Network.csproj --configuration ${{ env.CONFIGURATION }} --no-build --output artifacts -p:PackageVersion=${{ steps.version.outputs.value }} -p:ContinuousIntegrationBuild=true

      - name: Push To NuGet
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
